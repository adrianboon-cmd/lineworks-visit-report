<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客戶 CRM</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#222;font-family:Arial,"Noto Sans TC",sans-serif}.container{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08)}h1{margin:0 0 6px;font-size:24px}h2{margin:0 0 14px;font-size:18px}.subtitle{margin:0 0 22px;color:#666;font-size:14px;line-height:1.6}.mode-badge{display:inline-block;margin-bottom:16px;padding:6px 10px;border-radius:999px;background:#eef5ff;color:#1769e0;font-size:13px;font-weight:700}.section{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid #e6e8eb}.field{margin-bottom:16px}label{display:block;margin-bottom:7px;font-weight:700}.required{color:#d93025}.hint{margin-top:6px;color:#7b8189;font-size:12px;line-height:1.5}input,select,textarea,button{width:100%;font:inherit}input,select,textarea{border:1px solid #c8cdd3;border-radius:8px;padding:12px;background:#fff}input:focus,select:focus,textarea:focus{outline:none;border-color:#1f6feb;box-shadow:0 0 0 3px rgba(31,111,235,.12)}textarea{min-height:105px;resize:vertical}.search-row{display:grid;grid-template-columns:1fr 120px;gap:10px}.primary-button,.lookup-button{border:0;border-radius:8px;padding:12px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.lookup-button{border:1px solid #1f6feb;background:#fff;color:#1f6feb}.primary-button:disabled,.lookup-button:disabled{opacity:.55;cursor:not-allowed}.status{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.5}.status.success{display:block;color:#116329;background:#dafbe1}.status.warning{display:block;color:#7a4e00;background:#fff4ce}.status.error{display:block;color:#a40e26;background:#ffebe9}.result-list{display:none;margin-top:12px}.result-list.visible{display:block}.result-list-title{margin-bottom:10px;color:#444;font-size:14px;font-weight:700}.result-item{margin-bottom:9px;padding:13px;border:1px solid #d8dee4;border-radius:10px;background:#fff;color:#222;text-align:left;cursor:pointer}.result-item:hover{border-color:#1f6feb;background:#f6f9ff}.result-item-name{margin-bottom:6px;font-weight:700}.result-item-info{color:#666;font-size:13px;line-height:1.6}.action-button{margin-top:7px;padding:12px;border:1px dashed #c17b00;border-radius:8px;background:#fffaf0;color:#7a4e00;font-weight:700;cursor:pointer}.selected-box,.form-box,.detail-box{display:none;margin-bottom:18px;padding:14px;border-radius:10px}.selected-box{border:1px solid #8cc9a0;background:#f0fff4}.form-box{border:1px solid #f0c36d;background:#fffaf0}.detail-box{border:1px solid #b6c8e6;background:#f7faff}.selected-box.visible,.form-box.visible,.detail-box.visible{display:block}.selected-title,.detail-title{margin-bottom:12px;color:#116329;font-weight:700}.detail-title{color:#174ea6}.form-box-title{margin-bottom:14px;color:#7a4e00;font-weight:700}.selected-info,.detail-info{font-size:14px;line-height:1.8}.secondary-button{margin-top:8px;padding:10px;border:1px solid #6e7781;border-radius:8px;background:#fff;color:#57606a;font-weight:700;cursor:pointer}.submit-button{margin-top:6px;padding:14px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.submit-button:disabled{background:#9ba6b2}.final-result{display:none;margin-top:18px;padding:16px;border-radius:10px;background:#dafbe1;color:#116329;line-height:1.7}.final-result.visible{display:block}.contact-card{margin-top:10px;padding:12px;border:1px solid #d8dee4;border-radius:9px;background:#fff;line-height:1.7}.contact-name{font-weight:700}.empty{padding:12px;color:#666;background:#fff;border-radius:8px}.hidden{display:none!important}@media(max-width:480px){.search-row{grid-template-columns:1fr}.container{padding:12px}.card{padding:17px}}
  </style>
  <script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
</head>
<body>
<div class="container"><div class="card">
  <h1 id="pageTitle">客戶 CRM</h1>
  <div id="modeBadge" class="mode-badge">載入中...</div>
  <p id="pageSubtitle" class="subtitle">正在讀取功能設定。</p>

  <section id="customerQueryView" class="hidden">
    <div class="section">
      <h2>🔍 客戶查詢</h2>
      <div class="field">
        <label for="queryKeyword">公司名稱或搜尋關鍵字</label>
        <div class="search-row">
          <input id="queryKeyword" autocomplete="off" placeholder="例如：FUJIFILM、TSMC、富士軟片">
          <button id="queryButton" class="lookup-button" type="button">搜尋</button>
        </div>
        <div class="hint">可使用正式名稱、英文名稱、品牌名稱或簡稱。</div>
        <div id="queryStatus" class="status"></div>
      </div>
      <div id="queryResults" class="result-list">
        <div id="queryResultTitle" class="result-list-title"></div>
        <div id="queryResultList"></div>
      </div>
    </div>
    <div id="customerDetailBox" class="detail-box">
      <div class="detail-title">🏢 客戶完整資料</div>
      <div id="customerDetailInfo" class="detail-info"></div>
      <div id="customerContacts"></div>
      <button id="backToQueryButton" class="secondary-button" type="button">返回搜尋結果</button>
      <button id="createVisitFromCustomerButton" class="primary-button" type="button">為此客戶建立拜訪紀錄</button>
    </div>
  </section>

  <form id="visitForm" class="hidden">
    <section class="section">
      <h2>1. 選擇客戶</h2>
      <div id="customerSearchArea">
        <div class="field">
          <label for="customerKeyword">搜尋客戶 <span class="required">*</span></label>
          <div class="search-row"><input id="customerKeyword" autocomplete="off" placeholder="例如：富士軟片、FUJIFILM、TSMC"><button id="customerSearchButton" class="lookup-button" type="button">搜尋客戶</button></div>
          <div class="hint">可輸入公司名稱、英文名稱、品牌名稱、簡稱或其他搜尋關鍵字</div>
          <div id="customerSearchStatus" class="status"></div>
        </div>
        <div id="customerResultArea" class="result-list"><div id="customerResultTitle" class="result-list-title"></div><div id="customerResultList"></div><button id="showNewCustomerButton" class="action-button" type="button">＋ 找不到客戶，建立新客戶</button></div>
      </div>
      <div id="selectedCustomerBox" class="selected-box"><div class="selected-title">✅ 已選擇客戶</div><div id="selectedCustomerInfo" class="selected-info"></div><button id="changeCustomerButton" class="secondary-button" type="button">重新選擇客戶</button></div>
      <div id="newCustomerBox" class="form-box"><div class="form-box-title">🆕 建立新客戶</div>
        <div class="field"><label for="newCompanyId">統一編號 <span class="required">*</span></label><input id="newCompanyId" inputmode="numeric" autocomplete="off"></div>
        <div class="field"><label for="newCompanyName">客戶名稱 <span class="required">*</span></label><input id="newCompanyName"></div>
        <div class="field"><label for="newSearchKeywords">搜尋關鍵字</label><textarea id="newSearchKeywords" placeholder="例如：FUJIFILM、富士、FUJI FILM"></textarea></div>
        <div class="field"><label for="newCompanyPhone">公司電話</label><input id="newCompanyPhone" inputmode="tel"></div>
        <div class="field"><label for="newCompanyAddress">地址</label><input id="newCompanyAddress"></div>
        <div class="field"><label for="newIndustry">產業別 <span class="required">*</span></label><select id="newIndustry"><option value="">請選擇產業別</option><option>製造業</option><option>零售業</option><option>金融業</option><option>服務業</option><option>醫療生技業</option><option>社團法人</option><option>物流業</option><option>建築營造業</option><option>國營事業</option><option>政教機關</option><option>資訊業</option></select></div>
        <div class="field"><label for="newCustomerStatus">客戶狀態 <span class="required">*</span></label><select id="newCustomerStatus"><option value="潛在客戶" selected>潛在客戶</option><option>洽談中</option><option>既有客戶</option><option>停止追蹤</option></select></div>
        <div class="field"><label for="newCompanyNote">客戶備註</label><textarea id="newCompanyNote"></textarea></div>
        <button id="cancelNewCustomerButton" class="secondary-button" type="button">返回搜尋客戶</button>
      </div>
    </section>

    <section id="contactSection" class="section hidden"><h2>2. 選擇拜訪對象</h2><div id="contactLoadingStatus" class="status"></div><div id="contactResultArea" class="result-list"><div id="contactResultTitle" class="result-list-title"></div><div id="contactResultList"></div><button id="showNewContactButton" class="action-button" type="button">＋ 建立新聯絡人</button></div><div id="selectedContactBox" class="selected-box"><div class="selected-title">✅ 已選擇聯絡人</div><div id="selectedContactInfo" class="selected-info"></div><button id="changeContactButton" class="secondary-button" type="button">重新選擇聯絡人</button></div>
      <div id="newContactBox" class="form-box"><div class="form-box-title">🆕 建立新聯絡人</div><div class="field"><label for="newContactName">姓名 <span class="required">*</span></label><input id="newContactName"></div><div class="field"><label for="newDepartment">部門</label><input id="newDepartment"></div><div class="field"><label for="newJobTitle">職稱</label><input id="newJobTitle"></div><div class="field"><label for="newEmail">Email</label><input id="newEmail" type="email"></div><div class="field"><label for="newMobile">手機</label><input id="newMobile" inputmode="tel"></div><div class="field"><label for="newContactPhone">公司電話</label><input id="newContactPhone" inputmode="tel"></div><div class="field"><label for="newExtension">分機</label><input id="newExtension"></div><div class="field"><label for="newContactNote">備註</label><textarea id="newContactNote"></textarea></div><button id="cancelNewContactButton" class="secondary-button" type="button">返回選擇聯絡人</button></div>
    </section>

    <section id="visitSection" class="section hidden"><h2>3. 填寫拜訪內容</h2><div class="field"><label for="visitDate">拜訪日期 <span class="required">*</span></label><input type="date" id="visitDate" required></div><div class="field"><label for="visitType">拜訪方式 <span class="required">*</span></label><select id="visitType" required><option value="">請選擇拜訪方式</option><option>客戶拜訪</option><option>線上會議</option><option>電話</option><option>Email</option><option>LINE WORKS</option><option>其他</option></select></div><div class="field"><label for="visitContent">拜訪內容 <span class="required">*</span></label><textarea id="visitContent" required></textarea></div><div class="field"><label for="nextStep">下一步 <span class="required">*</span></label><textarea id="nextStep" required></textarea></div><div class="field"><label for="nextFollowupDate">下次追蹤日期</label><input type="date" id="nextFollowupDate"></div><div class="field"><label for="salesStage">案件階段</label><select id="salesStage"><option value="">請選擇案件階段</option><option>Stage 1</option><option>Stage 2</option><option>Stage 3</option><option>Stage 4</option><option>Stage 5</option><option>Stage 6</option><option>Stage 7</option></select></div></section>
    <button id="submitButton" class="submit-button hidden" type="submit">送出拜訪紀錄</button><div id="finalResult" class="final-result"></div>
  </form>
</div></div>
<script>
const $=id=>document.getElementById(id);
let WOFF_ID="",currentMode="visit",customerMode="unknown",contactMode="unknown",selectedCustomer=null,selectedContact=null,currentDetailCustomer=null;
const visitForm=$("visitForm"),customerQueryView=$("customerQueryView"),customerSearchArea=$("customerSearchArea"),customerKeyword=$("customerKeyword"),customerSearchButton=$("customerSearchButton"),customerSearchStatus=$("customerSearchStatus"),customerResultArea=$("customerResultArea"),customerResultTitle=$("customerResultTitle"),customerResultList=$("customerResultList"),selectedCustomerBox=$("selectedCustomerBox"),selectedCustomerInfo=$("selectedCustomerInfo"),newCustomerBox=$("newCustomerBox"),contactSection=$("contactSection"),contactLoadingStatus=$("contactLoadingStatus"),contactResultArea=$("contactResultArea"),contactResultTitle=$("contactResultTitle"),contactResultList=$("contactResultList"),selectedContactBox=$("selectedContactBox"),selectedContactInfo=$("selectedContactInfo"),newContactBox=$("newContactBox"),visitSection=$("visitSection"),submitButton=$("submitButton"),finalResult=$("finalResult");
function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function status(el,type,msg){el.className=`status ${type}`;el.textContent=msg}
function getRequestedMode(){return new URLSearchParams(location.search).get("mode")||"visit"}
async function loadAppConfig(){const requested=getRequestedMode();const r=await fetch("/api/config?mode="+encodeURIComponent(requested),{cache:"no-store"});const d=await r.json();if(!r.ok||!d.success||!d.woffId)throw new Error(d.message||"無法取得 WOFF 設定");WOFF_ID=String(d.woffId).trim();currentMode=d.mode||"visit";return d}
function applyMode(){if(currentMode==="customer"){$("pageTitle").textContent="客戶 CRM";$("modeBadge").textContent="🔍 客戶查詢";$("pageSubtitle").textContent="搜尋客戶並查看公司資料與聯絡人。";customerQueryView.classList.remove("hidden");visitForm.classList.add("hidden")}else{$("pageTitle").textContent="📝 拜訪紀錄回報";$("modeBadge").textContent="📝 拜訪回報";$("pageSubtitle").textContent="搜尋客戶、選擇聯絡人並建立拜訪紀錄。";customerQueryView.classList.add("hidden");visitForm.classList.remove("hidden")}}
const woffInitPromise=new Promise((resolve,reject)=>window.addEventListener("load",async()=>{try{if(!window.woff)throw new Error("WOFF SDK 未載入");await loadAppConfig();applyMode();await woff.init({woffId:WOFF_ID});console.log("WOFF initialized",currentMode,woff.isInClient());resolve(true)}catch(e){console.error(e);$("modeBadge").textContent="初始化失敗";$("pageSubtitle").textContent=e.message;reject(e)}},{once:true}));woffInitPromise.catch(()=>{});
$("visitDate").value=new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"});
async function fetchCustomers(keyword){const r=await fetch("/api/customers?keyword="+encodeURIComponent(keyword));const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"客戶搜尋失敗");return d}
function customerCard(c,handler){const b=document.createElement("button");b.type="button";b.className="result-item";b.innerHTML=`<div class="result-item-name">${esc(c.company_name)}</div><div class="result-item-info">統一編號：${esc(c.company_id)}<br>產業別：${esc(c.industry||"未設定")}<br>客戶狀態：${esc(c.customer_status||"未設定")}<br>公司電話：${esc(c.company_phone||"未填寫")}</div>`;b.onclick=()=>handler(c);return b}
async function queryCustomers(){const keyword=$("queryKeyword").value.trim();if(keyword.length<2){status($("queryStatus"),"error","請至少輸入 2 個字");return}$("queryButton").disabled=true;status($("queryStatus"),"warning","正在搜尋客戶資料");try{const d=await fetchCustomers(keyword);$("queryResultList").innerHTML="";$("queryResultTitle").textContent=d.found?`找到 ${d.count} 筆客戶，請選擇：`:"找不到符合的客戶。";(d.customers||[]).forEach(c=>$("queryResultList").appendChild(customerCard(c,showCustomerDetail)));$("queryResults").classList.add("visible");status($("queryStatus"),d.found?"success":"warning",d.found?`找到 ${d.count} 筆資料`:"查無客戶")}catch(e){status($("queryStatus"),"error",e.message)}finally{$("queryButton").disabled=false}}
async function showCustomerDetail(c){status($("queryStatus"),"warning","正在讀取客戶完整資料");try{const r=await fetch("/api/customer-detail?companyId="+encodeURIComponent(c.company_id));const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"客戶資料讀取失敗");currentDetailCustomer=d.customer;$("customerDetailInfo").innerHTML=`<strong>${esc(d.customer.company_name)}</strong><br>統一編號：${esc(d.customer.company_id)}<br>產業別：${esc(d.customer.industry||"未設定")}<br>客戶狀態：${esc(d.customer.customer_status||"未設定")}<br>公司電話：${esc(d.customer.company_phone||"未填寫")}<br>地址：${esc(d.customer.company_address||"未填寫")}<br>搜尋關鍵字：${esc(d.customer.search_keywords||"未設定")}<br>備註：${esc(d.customer.company_note||"未填寫")}`;const box=$("customerContacts");box.innerHTML=`<h3>聯絡人（${d.contactCount}）</h3>`;if(!d.contacts.length)box.innerHTML+='<div class="empty">目前沒有聯絡人</div>';d.contacts.forEach(p=>box.innerHTML+=`<div class="contact-card"><div class="contact-name">${esc(p.contact_name||"未命名")}</div>部門：${esc(p.department||"未填寫")}<br>職稱：${esc(p.job_title||"未填寫")}<br>Email：${esc(p.email||"未填寫")}<br>手機：${esc(p.mobile||"未填寫")}<br>Contact ID：${esc(p.contact_id)}</div>`);$("queryResults").classList.remove("visible");$("customerDetailBox").classList.add("visible");status($("queryStatus"),"success","客戶資料讀取完成")}catch(e){status($("queryStatus"),"error",e.message)}}
$("queryButton").onclick=queryCustomers;$("queryKeyword").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();queryCustomers()}};$("backToQueryButton").onclick=()=>{$("customerDetailBox").classList.remove("visible");$("queryResults").classList.add("visible")};$("createVisitFromCustomerButton").onclick=()=>{if(!currentDetailCustomer)return;location.href="/?mode=visit&companyId="+encodeURIComponent(currentDetailCustomer.company_id)};
async function searchVisitCustomers(){const keyword=customerKeyword.value.trim();if(keyword.length<2){status(customerSearchStatus,"error","請至少輸入 2 個字");return}customerSearchButton.disabled=true;status(customerSearchStatus,"warning","正在搜尋客戶資料");try{const d=await fetchCustomers(keyword);customerResultList.innerHTML="";customerResultTitle.textContent=d.found?`找到 ${d.count} 筆客戶，請選擇：`:"找不到符合的客戶。";(d.customers||[]).forEach(c=>customerResultList.appendChild(customerCard(c,selectCustomer)));customerResultArea.classList.add("visible");status(customerSearchStatus,d.found?"success":"warning",d.found?`找到 ${d.count} 筆符合資料`:"找不到符合的客戶，可以直接建立新客戶")}catch(e){status(customerSearchStatus,"error",e.message)}finally{customerSearchButton.disabled=false}}
async function selectCustomer(c){customerMode="existing";selectedCustomer=c;selectedCustomerInfo.innerHTML=`<strong>${esc(c.company_name)}</strong><br>統一編號：${esc(c.company_id)}<br>產業別：${esc(c.industry||"未設定")}<br>客戶狀態：${esc(c.customer_status||"未設定")}<br>公司電話：${esc(c.company_phone||"未填寫")}`;customerSearchArea.classList.add("hidden");selectedCustomerBox.classList.add("visible");contactSection.classList.remove("hidden");await loadContacts(c.company_id)}
function showNewCustomer(){customerMode="new";selectedCustomer=null;customerSearchArea.classList.add("hidden");selectedCustomerBox.classList.remove("visible");newCustomerBox.classList.add("visible");const q=customerKeyword.value.trim();if(/[\u3400-\u9FFF]/.test(q))$("newCompanyName").value=q;else $("newSearchKeywords").value=q;contactSection.classList.remove("hidden");showNewContact()}
async function loadContacts(companyId){contactMode="unknown";selectedContact=null;selectedContactBox.classList.remove("visible");newContactBox.classList.remove("visible");visitSection.classList.add("hidden");submitButton.classList.add("hidden");status(contactLoadingStatus,"warning","正在讀取聯絡人...");try{const r=await fetch("/api/contacts?companyId="+encodeURIComponent(companyId)),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"聯絡人查詢失敗");contactResultList.innerHTML="";contactResultTitle.textContent=d.found?`找到 ${d.count} 位聯絡人，請選擇：`:"目前沒有聯絡人。";(d.contacts||[]).forEach(p=>contactResultList.appendChild(contactCard(p)));contactResultArea.classList.add("visible");status(contactLoadingStatus,d.found?"success":"warning",d.found?`找到 ${d.count} 位聯絡人`:"此客戶目前沒有聯絡人")}catch(e){status(contactLoadingStatus,"error",e.message)}}
function contactCard(p){const b=document.createElement("button");b.type="button";b.className="result-item";b.innerHTML=`<div class="result-item-name">${esc(p.contact_name||"未填寫姓名")}</div><div class="result-item-info">部門：${esc(p.department||"未填寫")}<br>職稱：${esc(p.job_title||"未填寫")}<br>手機：${esc(p.mobile||"未填寫")}<br>Contact ID：${esc(p.contact_id)}</div>`;b.onclick=()=>selectContact(p);return b}
function selectContact(p){contactMode="existing";selectedContact=p;selectedContactInfo.innerHTML=`<strong>${esc(p.contact_name)}</strong><br>部門：${esc(p.department||"未填寫")}<br>職稱：${esc(p.job_title||"未填寫")}<br>Email：${esc(p.email||"未填寫")}<br>手機：${esc(p.mobile||"未填寫")}<br>Contact ID：${esc(p.contact_id)}`;contactResultArea.classList.remove("visible");newContactBox.classList.remove("visible");selectedContactBox.classList.add("visible");showVisit()}
function showNewContact(){contactMode="new";selectedContact=null;contactResultArea.classList.remove("visible");selectedContactBox.classList.remove("visible");newContactBox.classList.add("visible");if(selectedCustomer?.company_phone&&!$("newContactPhone").value)$("newContactPhone").value=selectedCustomer.company_phone;showVisit()}
function showVisit(){visitSection.classList.remove("hidden");submitButton.classList.remove("hidden")}
customerSearchButton.onclick=searchVisitCustomers;customerKeyword.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();searchVisitCustomers()}};$("showNewCustomerButton").onclick=showNewCustomer;$("changeCustomerButton").onclick=$("cancelNewCustomerButton").onclick=()=>location.href="/?mode=visit";$("showNewContactButton").onclick=showNewContact;$("changeContactButton").onclick=$("cancelNewContactButton").onclick=()=>selectedCustomer?loadContacts(selectedCustomer.company_id):showNewContact();
async function preselectCustomerFromUrl(){const id=new URLSearchParams(location.search).get("companyId");if(currentMode!=="visit"||!id)return;try{const r=await fetch("/api/customer-detail?companyId="+encodeURIComponent(id)),d=await r.json();if(r.ok&&d.success)await selectCustomer(d.customer)}catch(e){console.error(e)}}
async function sendSuccessMessage(data,v){await woffInitPromise;if(!woff.isInClient())throw new Error("目前不是從 LINE WORKS App 聊天室開啟");const c=data.customer,p=data.contact,id=data.visitRecordId,url=`https://fxtw-seminar.cybozu.com/k/1350/show#record=${id}`;await woff.sendMessage({content:`✅【拜訪紀錄回報完成】\n\n🏢 客戶名稱：${c.company_name}\n🆔 統一編號：${c.company_id}\n🏭 產業別：${c.industry||"未設定"}\n📊 客戶狀態：${c.customer_status||"未設定"}\n\n👤 拜訪對象：${p.contact_name}\n🏬 部門：${p.department||"未填寫"}\n💼 職稱：${p.job_title||"未填寫"}\n\n📅 拜訪日期：${v.visit_date}\n📌 拜訪方式：${v.visit_type}\n💬 拜訪內容：${v.visit_content}\n📝 下一步：${v.next_step}\n📆 下次追蹤日期：${v.next_followup_date||"未設定"}\n📈 案件階段：${v.sales_stage||"未設定"}\n\n${data.customerCreated?"🆕 已建立新客戶主檔":"📚 已使用既有客戶主檔"}\n${data.contactCreated?`🆕 已建立新聯絡人：${p.contact_id}`:`👤 已使用既有聯絡人：${p.contact_id}`}\n\n📂 Kintone 記錄編號｜${id}\n🔗 Kintone 紀錄：${url}\n\n🎉 感謝回報，辛苦了！`})}
visitForm.onsubmit=async e=>{e.preventDefault();if(customerMode==="unknown"||contactMode==="unknown"){alert("請先選擇或建立客戶與聯絡人");return}let customer;if(customerMode==="existing")customer={company_id:selectedCustomer.company_id};else{if(!$("newCompanyId").value.trim()||!$("newCompanyName").value.trim()||!$("newIndustry").value||!$("newCustomerStatus").value){alert("請完成新客戶必填資料");return}customer={company_id:$("newCompanyId").value.trim(),company_name:$("newCompanyName").value.trim(),search_keywords:$("newSearchKeywords").value.trim(),company_phone:$("newCompanyPhone").value.trim(),company_address:$("newCompanyAddress").value.trim(),industry:$("newIndustry").value,customer_status:$("newCustomerStatus").value,company_note:$("newCompanyNote").value.trim()}}let contact;if(contactMode==="existing")contact={contact_id:selectedContact.contact_id};else{if(!$("newContactName").value.trim()){alert("請輸入聯絡人姓名");return}contact={contact_name:$("newContactName").value.trim(),department:$("newDepartment").value.trim(),job_title:$("newJobTitle").value.trim(),email:$("newEmail").value.trim(),mobile:$("newMobile").value.trim(),phone:$("newContactPhone").value.trim(),extension:$("newExtension").value.trim(),contact_note:$("newContactNote").value.trim()}}const visit={visit_date:$("visitDate").value,visit_type:$("visitType").value,visit_content:$("visitContent").value.trim(),next_step:$("nextStep").value.trim(),next_followup_date:$("nextFollowupDate").value,sales_stage:$("salesStage").value};if(!visit.visit_date||!visit.visit_type||!visit.visit_content||!visit.next_step){alert("請完成拜訪資料必填欄位");return}submitButton.disabled=true;submitButton.textContent="送出中...";try{const r=await fetch("/api/visit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customerMode,contactMode,customer,contact,visit})}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"建立拜訪紀錄失敗");let msg="LINE WORKS 聊天室訊息已送出";try{await sendSuccessMessage(d,visit)}catch(err){msg="Kintone 已完成，但 LINE WORKS 訊息傳送失敗："+(err.message||"未知錯誤")}finalResult.innerHTML=`<strong>✅ 拜訪紀錄建立成功</strong><br><br>客戶：${esc(d.customer.company_name)}<br>客戶狀態：${esc(d.customer.customer_status||"未設定")}<br>聯絡人：${esc(d.contact.contact_name)}<br>Contact ID：${esc(d.contact.contact_id)}<br>Kintone Record ID：${esc(d.visitRecordId)}<br><br>${esc(msg)}`;finalResult.classList.add("visible");window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}catch(err){console.error(err);alert(err.message)}finally{submitButton.disabled=false;submitButton.textContent="送出拜訪紀錄"}};
woffInitPromise.then(preselectCustomerFromUrl).catch(()=>{});
</script>
