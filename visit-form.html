<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客戶 CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#222;font-family:Arial,"Noto Sans TC",sans-serif}.container{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px #00000014}h1{margin:0 0 6px;font-size:24px}h2{font-size:18px}.subtitle{color:#666;font-size:14px;line-height:1.6}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef5ff;color:#1769e0;font-size:13px;font-weight:700}.section{margin:20px 0;padding-bottom:20px;border-bottom:1px solid #e6e8eb}.field{margin-bottom:16px}label{display:block;margin-bottom:7px;font-weight:700}.required{color:#d93025}.hint{margin-top:6px;color:#7b8189;font-size:12px}input,select,textarea,button{width:100%;font:inherit}input,select,textarea{border:1px solid #c8cdd3;border-radius:8px;padding:12px;background:#fff}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 120px;gap:10px}.blue,.outline,.secondary,.action{padding:12px;border-radius:8px;font-weight:700;cursor:pointer}.blue{border:0;background:#1769e0;color:#fff}.outline{border:1px solid #1769e0;background:#fff;color:#1769e0}.secondary{margin-top:8px;border:1px solid #6e7781;background:#fff;color:#57606a}.action{margin-top:8px;border:1px dashed #c17b00;background:#fffaf0;color:#7a4e00}.status{display:none;margin-top:10px;padding:10px;border-radius:8px;font-size:14px}.status.success{display:block;background:#dafbe1;color:#116329}.status.warning{display:block;background:#fff4ce;color:#7a4e00}.status.error{display:block;background:#ffebe9;color:#a40e26}.results{display:none;margin-top:12px}.results.visible{display:block}.result{margin-bottom:9px;padding:13px;border:1px solid #d8dee4;border-radius:10px;background:#fff;text-align:left;cursor:pointer}.name{font-weight:700;margin-bottom:6px}.info{color:#666;font-size:13px;line-height:1.65}.box{display:none;margin:15px 0;padding:14px;border-radius:10px}.box.visible{display:block}.selected{border:1px solid #8cc9a0;background:#f0fff4}.formbox{border:1px solid #f0c36d;background:#fffaf0}.detail{border:1px solid #b6c8e6;background:#f7faff}.contact-card{margin-top:10px;padding:12px;border:1px solid #d8dee4;border-radius:9px;background:#fff;line-height:1.7}.final{display:none;margin-top:18px;padding:16px;border-radius:10px;background:#dafbe1;color:#116329;line-height:1.7}.final.visible{display:block}.hidden{display:none!important}@media(max-width:480px){.row{grid-template-columns:1fr}.container{padding:12px}}
</style>
<script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
</head>
<body><div class="container"><div class="card">
<h1 id="title">客戶 CRM</h1><span id="badge" class="badge">載入中</span><p id="subtitle" class="subtitle"></p>

<section id="customerView" class="hidden"><div class="section"><h2>🔍 客戶查詢</h2><div class="field"><label for="cq">公司名稱或關鍵字</label><div class="row"><input id="cq" placeholder="FUJIFILM、TSMC、富士軟片"><button id="cqBtn" class="outline" type="button">搜尋</button></div><div id="cqStatus" class="status"></div></div><div id="cqResults" class="results"><div id="cqTitle"></div><div id="cqList"></div></div></div><div id="customerDetail" class="box detail"><h2>🏢 客戶完整資料</h2><div id="customerDetailInfo"></div><div id="customerDetailContacts"></div><button id="customerBack" class="secondary" type="button">返回搜尋結果</button><button id="customerVisit" class="blue" type="button">為此客戶建立拜訪紀錄</button></div></section>

<section id="contactView" class="hidden"><div class="section"><h2>👥 聯絡人查詢</h2><div class="field"><label for="contactQuery">搜尋聯絡人</label><div class="row"><input id="contactQuery" placeholder="姓名、公司、部門、職稱、Email、手機"><button id="contactQueryBtn" class="outline" type="button">搜尋</button></div><div class="hint">至少輸入 2 個字，可搜尋王大明、資訊部、經理或 Email。</div><div id="contactQueryStatus" class="status"></div></div><div id="contactQueryResults" class="results"><div id="contactQueryTitle"></div><div id="contactQueryList"></div></div></div><div id="contactDetail" class="box detail"><h2>👤 聯絡人完整資料</h2><div id="contactDetailInfo"></div><button id="contactBack" class="secondary" type="button">返回搜尋結果</button><button id="contactCustomer" class="outline" type="button">查看所屬公司</button><button id="contactVisit" class="blue" type="button">為此聯絡人建立拜訪紀錄</button></div></section>

<form id="visitForm" class="hidden">
<section class="section"><h2>1. 選擇客戶</h2><div id="customerSearch"><div class="field"><label for="customerKeyword">搜尋客戶 <span class="required">*</span></label><div class="row"><input id="customerKeyword" placeholder="富士軟片、FUJIFILM、TSMC"><button id="customerBtn" class="outline" type="button">搜尋</button></div><div id="customerStatus" class="status"></div></div><div id="customerResults" class="results"><div id="customerResultsTitle"></div><div id="customerList"></div><button id="newCustomerBtn" class="action" type="button">＋ 建立新客戶</button></div></div><div id="selectedCustomer" class="box selected"><h3>✅ 已選擇客戶</h3><div id="selectedCustomerInfo"></div><button id="changeCustomer" class="secondary" type="button">重新選擇客戶</button></div><div id="newCustomer" class="box formbox"><h3>🆕 建立新客戶</h3><div class="field"><label>統一編號 *</label><input id="newCompanyId"></div><div class="field"><label>客戶名稱 *</label><input id="newCompanyName"></div><div class="field"><label>搜尋關鍵字</label><textarea id="newKeywords"></textarea></div><div class="field"><label>公司電話</label><input id="newCompanyPhone"></div><div class="field"><label>地址</label><input id="newAddress"></div><div class="field"><label>產業別 *</label><select id="newIndustry"><option value="">請選擇</option><option>製造業</option><option>零售業</option><option>金融業</option><option>服務業</option><option>醫療生技業</option><option>社團法人</option><option>物流業</option><option>建築營造業</option><option>國營事業</option><option>政教機關</option><option>資訊業</option></select></div><div class="field"><label>客戶狀態 *</label><select id="newCustomerStatus"><option>潛在客戶</option><option>洽談中</option><option>既有客戶</option><option>停止追蹤</option></select></div><div class="field"><label>備註</label><textarea id="newCompanyNote"></textarea></div><button id="cancelNewCustomer" class="secondary" type="button">返回</button></div></section>
<section id="contactSection" class="section hidden"><h2>2. 選擇拜訪對象</h2><div id="contactStatus" class="status"></div><div id="contactResults" class="results"><div id="contactResultsTitle"></div><div id="contactList"></div><button id="newContactBtn" class="action" type="button">＋ 建立新聯絡人</button></div><div id="selectedContact" class="box selected"><h3>✅ 已選擇聯絡人</h3><div id="selectedContactInfo"></div><button id="changeContact" class="secondary" type="button">重新選擇聯絡人</button></div><div id="newContact" class="box formbox"><h3>🆕 建立新聯絡人</h3><div class="field"><label>姓名 *</label><input id="newContactName"></div><div class="field"><label>部門</label><input id="newDepartment"></div><div class="field"><label>職稱</label><input id="newJobTitle"></div><div class="field"><label>Email</label><input id="newEmail" type="email"></div><div class="field"><label>手機</label><input id="newMobile"></div><div class="field"><label>公司電話</label><input id="newContactPhone"></div><div class="field"><label>分機</label><input id="newExtension"></div><div class="field"><label>備註</label><textarea id="newContactNote"></textarea></div><button id="cancelNewContact" class="secondary" type="button">返回</button></div></section>
<section id="visitSection" class="section hidden"><h2>3. 填寫拜訪內容</h2><div class="field"><label>拜訪日期 *</label><input id="visitDate" type="date"></div><div class="field"><label>拜訪方式 *</label><select id="visitType"><option value="">請選擇</option><option>客戶拜訪</option><option>線上會議</option><option>電話</option><option>Email</option><option>LINE WORKS</option><option>其他</option></select></div><div class="field"><label>拜訪內容 *</label><textarea id="visitContent"></textarea></div><div class="field"><label>下一步 *</label><textarea id="nextStep"></textarea></div><div class="field"><label>下次追蹤日期</label><input id="followDate" type="date"></div><div class="field"><label>案件階段</label><select id="salesStage"><option value="">請選擇</option><option>Stage 1</option><option>Stage 2</option><option>Stage 3</option><option>Stage 4</option><option>Stage 5</option><option>Stage 6</option><option>Stage 7</option></select></div></section><button id="submitBtn" class="blue hidden" type="submit">送出拜訪紀錄</button><div id="finalResult" class="final"></div>
</form></div></div>
<script>
const $=id=>document.getElementById(id);let WOFF_ID="",mode="visit",customerMode="unknown",contactMode="unknown",selectedCustomer=null,selectedContact=null,detailCustomer=null,detailContact=null;
const esc=v=>String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function status(id,type,msg){const e=$(id);e.className=`status ${type}`;e.textContent=msg}function show(id){$(id).classList.remove("hidden")}function hide(id){$(id).classList.add("hidden")}
async function config(){const requested=new URLSearchParams(location.search).get("mode")||"visit";const r=await fetch("/api/config?mode="+encodeURIComponent(requested),{cache:"no-store"}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"無法取得設定");WOFF_ID=d.woffId;mode=d.mode;return d}
function applyMode(){hide("visitForm");hide("customerView");hide("contactView");if(mode==="customer"){$("title").textContent="客戶 CRM";$("badge").textContent="🔍 客戶查詢";$("subtitle").textContent="搜尋客戶並查看公司與聯絡人資料。";show("customerView")}else if(mode==="contact"){$("title").textContent="客戶 CRM";$("badge").textContent="👥 聯絡人查詢";$("subtitle").textContent="依姓名、公司、部門、職稱、Email 或手機搜尋聯絡人。";show("contactView")}else{$("title").textContent="📝 拜訪紀錄回報";$("badge").textContent="📝 拜訪回報";$("subtitle").textContent="搜尋客戶、選擇聯絡人並建立拜訪紀錄。";show("visitForm")}}
const ready=new Promise((resolve,reject)=>window.addEventListener("load",async()=>{try{if(!window.woff)throw new Error("WOFF SDK 未載入");await config();applyMode();await woff.init({woffId:WOFF_ID});resolve()}catch(e){$("badge").textContent="初始化失敗";$("subtitle").textContent=e.message;reject(e)}},{once:true}));ready.catch(()=>{});$("visitDate").value=new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"});
async function customerSearch(q){const r=await fetch("/api/customers?keyword="+encodeURIComponent(q)),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"搜尋失敗");return d}function customerCard(c,fn){const b=document.createElement("button");b.type="button";b.className="result";b.innerHTML=`<div class="name">${esc(c.company_name)}</div><div class="info">統編：${esc(c.company_id)}<br>產業：${esc(c.industry||"未設定")}<br>狀態：${esc(c.customer_status||"未設定")}<br>電話：${esc(c.company_phone||"未填寫")}</div>`;b.onclick=()=>fn(c);return b}
async function queryCustomers(){const q=$("cq").value.trim();if(q.length<2)return status("cqStatus","error","請至少輸入 2 個字");status("cqStatus","warning","搜尋中...");try{const d=await customerSearch(q);$("cqList").innerHTML="";$("cqTitle").textContent=d.found?`找到 ${d.count} 筆客戶`:"查無資料";(d.customers||[]).forEach(c=>$("cqList").appendChild(customerCard(c,showCustomerDetail)));$("cqResults").classList.add("visible");status("cqStatus",d.found?"success":"warning",d.found?"搜尋完成":"查無資料")}catch(e){status("cqStatus","error",e.message)}}
async function showCustomerDetail(c){const r=await fetch("/api/customer-detail?companyId="+encodeURIComponent(c.company_id)),d=await r.json();if(!r.ok||!d.success)return status("cqStatus","error",d.message||"讀取失敗");detailCustomer=d.customer;$("customerDetailInfo").innerHTML=`<strong>${esc(d.customer.company_name)}</strong><br>統編：${esc(d.customer.company_id)}<br>產業：${esc(d.customer.industry||"未設定")}<br>狀態：${esc(d.customer.customer_status||"未設定")}<br>電話：${esc(d.customer.company_phone||"未填寫")}<br>地址：${esc(d.customer.company_address||"未填寫")}<br>關鍵字：${esc(d.customer.search_keywords||"未設定")}<br>備註：${esc(d.customer.company_note||"未填寫")}`;const box=$("customerDetailContacts");box.innerHTML=`<h3>聯絡人（${d.contactCount}）</h3>`;(d.contacts||[]).forEach(p=>box.innerHTML+=contactHtml(p));$("cqResults").classList.remove("visible");$("customerDetail").classList.add("visible")}
function contactHtml(p){return `<div class="contact-card"><div class="name">${esc(p.contact_name||"未命名")}</div>公司：${esc(p.company_name||"未填寫")}<br>部門：${esc(p.department||"未填寫")}<br>職稱：${esc(p.job_title||"未填寫")}<br>Email：${esc(p.email||"未填寫")}<br>手機：${esc(p.mobile||"未填寫")}<br>Contact ID：${esc(p.contact_id)}</div>`}
$("cqBtn").onclick=queryCustomers;$("cq").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();queryCustomers()}};$("customerBack").onclick=()=>{$("customerDetail").classList.remove("visible");$("cqResults").classList.add("visible")};$("customerVisit").onclick=()=>location.href=`/?mode=visit&companyId=${encodeURIComponent(detailCustomer.company_id)}`;
async function queryContacts(){const q=$("contactQuery").value.trim();if(q.length<2)return status("contactQueryStatus","error","請至少輸入 2 個字");status("contactQueryStatus","warning","搜尋中...");try{const r=await fetch("/api/contact-search?keyword="+encodeURIComponent(q)),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"搜尋失敗");$("contactQueryList").innerHTML="";$("contactQueryTitle").textContent=d.found?`找到 ${d.count} 位聯絡人`:"查無資料";(d.contacts||[]).forEach(p=>{const b=document.createElement("button");b.type="button";b.className="result";b.innerHTML=`<div class="name">${esc(p.contact_name||"未命名")}</div><div class="info">公司：${esc(p.company_name||"未填寫")}<br>部門：${esc(p.department||"未填寫")}｜職稱：${esc(p.job_title||"未填寫")}<br>Email：${esc(p.email||"未填寫")}<br>手機：${esc(p.mobile||"未填寫")}</div>`;b.onclick=()=>showContactDetail(p);$("contactQueryList").appendChild(b)});$("contactQueryResults").classList.add("visible");status("contactQueryStatus",d.found?"success":"warning",d.found?"搜尋完成":"查無資料")}catch(e){status("contactQueryStatus","error",e.message)}}
function showContactDetail(p){detailContact=p;$("contactDetailInfo").innerHTML=contactHtml(p);$("contactQueryResults").classList.remove("visible");$("contactDetail").classList.add("visible")}
$("contactQueryBtn").onclick=queryContacts;$("contactQuery").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();queryContacts()}};$("contactBack").onclick=()=>{$("contactDetail").classList.remove("visible");$("contactQueryResults").classList.add("visible")};$("contactCustomer").onclick=()=>location.href=`/?mode=customer&companyId=${encodeURIComponent(detailContact.company_id)}`;$("contactVisit").onclick=()=>location.href=`/?mode=visit&companyId=${encodeURIComponent(detailContact.company_id)}&contactId=${encodeURIComponent(detailContact.contact_id)}`;
async function visitCustomerSearch(){const q=$("customerKeyword").value.trim();if(q.length<2)return status("customerStatus","error","請至少輸入 2 個字");try{const d=await customerSearch(q);$("customerList").innerHTML="";$("customerResultsTitle").textContent=d.found?`找到 ${d.count} 筆客戶`:"查無資料";(d.customers||[]).forEach(c=>$("customerList").appendChild(customerCard(c,selectCustomer)));$("customerResults").classList.add("visible");status("customerStatus",d.found?"success":"warning",d.found?"搜尋完成":"查無資料")}catch(e){status("customerStatus","error",e.message)}}
async function selectCustomer(c,preferredContactId=""){customerMode="existing";selectedCustomer=c;$("selectedCustomerInfo").innerHTML=`<strong>${esc(c.company_name)}</strong><br>統編：${esc(c.company_id)}<br>產業：${esc(c.industry||"未設定")}<br>狀態：${esc(c.customer_status||"未設定")}`;hide("customerSearch");$("selectedCustomer").classList.add("visible");show("contactSection");await loadContacts(c.company_id,preferredContactId)}
function showNewCustomer(){customerMode="new";hide("customerSearch");$("newCustomer").classList.add("visible");const q=$("customerKeyword").value.trim();if(/[\u3400-\u9fff]/.test(q))$("newCompanyName").value=q;else $("newKeywords").value=q;show("contactSection");showNewContact()}
async function loadContacts(companyId,preferred=""){contactMode="unknown";selectedContact=null;$("selectedContact").classList.remove("visible");$("newContact").classList.remove("visible");hide("visitSection");hide("submitBtn");status("contactStatus","warning","讀取聯絡人...");const r=await fetch("/api/contacts?companyId="+encodeURIComponent(companyId)),d=await r.json();if(!r.ok||!d.success)return status("contactStatus","error",d.message||"讀取失敗");$("contactList").innerHTML="";(d.contacts||[]).forEach(p=>{const b=document.createElement("button");b.type="button";b.className="result";b.innerHTML=`<div class="name">${esc(p.contact_name)}</div><div class="info">部門：${esc(p.department||"未填寫")}｜職稱：${esc(p.job_title||"未填寫")}<br>Contact ID：${esc(p.contact_id)}</div>`;b.onclick=()=>selectContact(p);$("contactList").appendChild(b)});$("contactResultsTitle").textContent=d.found?`找到 ${d.count} 位聯絡人`:"目前沒有聯絡人";$("contactResults").classList.add("visible");status("contactStatus",d.found?"success":"warning",d.found?"讀取完成":"目前沒有聯絡人");if(preferred){const p=(d.contacts||[]).find(x=>x.contact_id===preferred);if(p)selectContact(p)}}
function selectContact(p){contactMode="existing";selectedContact=p;$("selectedContactInfo").innerHTML=contactHtml(p);$("contactResults").classList.remove("visible");$("selectedContact").classList.add("visible");showVisit()}
function showNewContact(){contactMode="new";$("contactResults").classList.remove("visible");$("selectedContact").classList.remove("visible");$("newContact").classList.add("visible");showVisit()}function showVisit(){show("visitSection");show("submitBtn")}
$("customerBtn").onclick=visitCustomerSearch;$("customerKeyword").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();visitCustomerSearch()}};$("newCustomerBtn").onclick=showNewCustomer;$("changeCustomer").onclick=$("cancelNewCustomer").onclick=()=>location.href="/?mode=visit";$("newContactBtn").onclick=showNewContact;$("changeContact").onclick=$("cancelNewContact").onclick=()=>selectedCustomer?loadContacts(selectedCustomer.company_id):showNewContact();
async function preload(){const p=new URLSearchParams(location.search),companyId=p.get("companyId"),contactId=p.get("contactId")||"";if(mode==="customer"&&companyId){const r=await fetch("/api/customer-detail?companyId="+encodeURIComponent(companyId)),d=await r.json();if(r.ok&&d.success)showCustomerDetail(d.customer)}if(mode==="visit"&&companyId){const r=await fetch("/api/customer-detail?companyId="+encodeURIComponent(companyId)),d=await r.json();if(r.ok&&d.success)selectCustomer(d.customer,contactId)}}ready.then(preload).catch(()=>{});
async function sendMessage(d,v){await ready;if(!woff.isInClient())throw new Error("目前不是從 LINE WORKS 聊天室開啟");await woff.sendMessage({content:`✅【拜訪紀錄回報完成】\n\n🏢 客戶：${d.customer.company_name}\n👤 對象：${d.contact.contact_name}\n📅 日期：${v.visit_date}\n📌 方式：${v.visit_type}\n💬 內容：${v.visit_content}\n📝 下一步：${v.next_step}\n📂 Kintone Record ID：${d.visitRecordId}`})}
$("visitForm").onsubmit=async e=>{e.preventDefault();if(customerMode==="unknown"||contactMode==="unknown")return alert("請完成客戶與聯絡人選擇");let customer=customerMode==="existing"?{company_id:selectedCustomer.company_id}:{company_id:$("newCompanyId").value.trim(),company_name:$("newCompanyName").value.trim(),search_keywords:$("newKeywords").value.trim(),company_phone:$("newCompanyPhone").value.trim(),company_address:$("newAddress").value.trim(),industry:$("newIndustry").value,customer_status:$("newCustomerStatus").value,company_note:$("newCompanyNote").value.trim()};if(customerMode==="new"&&(!customer.company_id||!customer.company_name||!customer.industry))return alert("請完成新客戶必填資料");let contact=contactMode==="existing"?{contact_id:selectedContact.contact_id}:{contact_name:$("newContactName").value.trim(),department:$("newDepartment").value.trim(),job_title:$("newJobTitle").value.trim(),email:$("newEmail").value.trim(),mobile:$("newMobile").value.trim(),phone:$("newContactPhone").value.trim(),extension:$("newExtension").value.trim(),contact_note:$("newContactNote").value.trim()};if(contactMode==="new"&&!contact.contact_name)return alert("請輸入聯絡人姓名");const visit={visit_date:$("visitDate").value,visit_type:$("visitType").value,visit_content:$("visitContent").value.trim(),next_step:$("nextStep").value.trim(),next_followup_date:$("followDate").value,sales_stage:$("salesStage").value};if(!visit.visit_date||!visit.visit_type||!visit.visit_content||!visit.next_step)return alert("請完成拜訪必填資料");$("submitBtn").disabled=true;try{const r=await fetch("/api/visit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customerMode,contactMode,customer,contact,visit})}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"建立失敗");let m="LINE WORKS 訊息已送出";try{await sendMessage(d,visit)}catch(err){m="Kintone 已完成，但訊息未送出："+err.message}$("finalResult").innerHTML=`<strong>✅ 建立成功</strong><br>客戶：${esc(d.customer.company_name)}<br>聯絡人：${esc(d.contact.contact_name)}<br>Record ID：${esc(d.visitRecordId)}<br>${esc(m)}`;$("finalResult").classList.add("visible")}catch(err){alert(err.message)}finally{$("submitBtn").disabled=false}};
</script></body></html>
