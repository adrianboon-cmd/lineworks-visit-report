<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer CRM</title>
<style>
*{box-sizing:border-box}
:root{--primary:#1769e0;--primary-dark:#0f5dcc;--bg:#f4f6f8;--text:#222;--muted:#667085;--line:#e6e8eb;--success:#116329;--warning:#7a4e00;--danger:#a40e26}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans TC","Noto Sans JP",sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}h1{margin:0 0 6px;font-size:24px}h2{font-size:18px;margin:0 0 14px}h3{font-size:16px;margin:0 0 14px}
.langs{display:flex;gap:5px}.langs button{width:auto;padding:6px 9px;border:1px solid #c8cdd3;border-radius:7px;background:#fff;color:#57606a;cursor:pointer}.langs button:hover{border-color:var(--primary)}.langs .on{background:var(--primary);color:#fff;border-color:var(--primary)}
#subtitle{margin:8px 0 18px;color:#666;font-size:14px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef5ff;color:var(--primary);font-size:13px;font-weight:700}
.identity{margin:14px 0 18px;padding:12px 14px;border-radius:10px;background:#fff4ce;color:var(--warning);line-height:1.6}.identity.ok{border:1px solid #8cc9a0;background:#f0fff4;color:var(--success)}.identity.bad{border:1px solid #f3a6a2;background:#ffebe9;color:var(--danger)}
.section{margin:20px 0;padding-bottom:20px;border-bottom:1px solid var(--line)}.field{margin:0 0 16px}label{display:block;margin-bottom:7px;font-weight:700}
input,select,textarea,button{width:100%;font:inherit}input,select,textarea{border:1px solid #c8cdd3;border-radius:8px;padding:12px;background:#fff;color:#222}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(23,105,224,.12)}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 120px;gap:10px}
.blue,.outline,.secondary,.action{padding:12px;border-radius:8px;font-weight:700;cursor:pointer}.blue{border:0;background:var(--primary);color:#fff}.blue:hover{background:var(--primary-dark)}.blue:disabled{opacity:.55}.outline{border:1px solid var(--primary);background:#fff;color:var(--primary)}.outline:hover{background:#f6f9ff}.secondary{margin-top:8px;border:1px solid #6e7781;background:#fff;color:#57606a}.action{margin-top:8px;border:1px dashed #c17b00;background:#fffaf0;color:var(--warning)}
.status{display:none;margin-top:10px;padding:10px;border-radius:8px;font-size:14px}.status.show{display:block}.status.err{background:#ffebe9;color:var(--danger)}.status.ok{background:#dafbe1;color:var(--success)}.results{display:none;margin-top:12px}.results.show{display:block}
.item,.visit-card{margin:9px 0;padding:13px;border:1px solid #d8dee4;border-radius:10px;background:#fff;line-height:1.65}.item{text-align:left;cursor:pointer}.item:hover{border-color:var(--primary);background:#f7faff}.visit-card{background:#fbfcfe}
.box{display:none;margin:15px 0;padding:14px;border-radius:10px}.box.show{display:block}.selected{border:1px solid #8cc9a0;background:#f0fff4}.formbox{border:1px solid #f0c36d;background:#fffaf0}.detail{border:1px solid #b6c8e6;background:#f7faff}.name{font-weight:700;margin-bottom:6px}.muted{color:var(--muted);font-size:13px}.contact-card{margin-top:10px;padding:12px;border:1px solid #d8dee4;border-radius:9px;background:#fff}.hidden{display:none!important}
#submitBtn{margin-top:8px;padding:14px}
@media(max-width:520px){.wrap{padding:10px}.card{padding:17px}.top{display:block}.langs{margin:10px 0}.row{grid-template-columns:1fr}h1{font-size:22px}}
</style>
<script src="https://static.worksmobile.net/static/wm/woff/edge/3.7.4/sdk.js"></script></head><body><div class="wrap"><div class="card">
<div class="top"><div><h1 id="pageTitle">Customer CRM</h1><span id="modeBadge" class="badge">Loading</span></div><div class="langs"><button data-lang="zh-TW">繁中</button><button data-lang="en">EN</button><button data-lang="ja">日本語</button></div></div><p id="subtitle"></p><div id="identity" class="identity">Verifying...</div><main id="app" class="hidden">
<section id="customerView" class="hidden"><div class="section"><h2 data-t="customerSearch"></h2><div class="row"><input id="cq"><button id="cqBtn" class="outline" data-t="search"></button></div><div id="cqStatus" class="status"></div><div id="cqResults" class="results"><div id="cqList"></div></div></div><div id="customerDetail" class="box detail"><h2 data-t="customerDetail"></h2><div id="customerDetailInfo"></div><div id="customerContacts"></div><button id="customerBack" class="secondary" data-t="back"></button><button id="customerVisit" class="blue" data-t="createVisit"></button></div></section>
<section id="contactView" class="hidden"><div class="section"><h2 data-t="contactSearch"></h2><div class="row"><input id="contactQuery"><button id="contactQueryBtn" class="outline" data-t="search"></button></div><div id="contactQueryStatus" class="status"></div><div id="contactQueryResults" class="results"><div id="contactQueryList"></div></div></div><div id="contactDetail" class="box detail"><h2 data-t="contactDetail"></h2><div id="contactDetailInfo"></div><button id="contactBack" class="secondary" data-t="back"></button><button id="contactCustomer" class="outline" data-t="viewCompany"></button><button id="contactVisit" class="blue" data-t="createVisit"></button></div></section>
<section id="historyView" class="hidden"><div class="section"><h2 data-t="history"></h2><div class="row"><input id="historyQuery"><button id="historyQueryBtn" class="outline" data-t="search"></button></div><div id="historyStatus" class="status"></div><div id="historyResults" class="results"><div id="historyCustomerList"></div></div></div><div id="historyDetail" class="box detail"><h2 id="historyCompanyTitle"></h2><div id="historyCompanyInfo"></div><div id="historyCount" class="name"></div><div id="historyList"></div><button id="historyBack" class="secondary" data-t="back"></button></div></section>
<form id="visitForm" class="hidden"><section class="section"><h2 data-t="stepCustomer"></h2><div id="customerSearch"><div class="row"><input id="customerKeyword"><button id="customerBtn" class="outline" data-t="search"></button></div><div id="customerStatus" class="status"></div><div id="customerResults" class="results"><div id="customerList"></div><button id="newCustomerBtn" type="button" class="action" data-t="addCustomer"></button></div></div><div id="selectedCustomer" class="box selected"><div id="selectedCustomerInfo"></div><button id="changeCustomer" type="button" class="secondary" data-t="change"></button></div><div id="newCustomer" class="box formbox"><h3 data-t="addCustomer"></h3><div class="field"><label data-t="companyId"></label><input id="newCompanyId"></div><div class="field"><label data-t="customerName"></label><input id="newCompanyName"></div><div class="field"><label data-t="keywords"></label><textarea id="newKeywords"></textarea></div><div class="field"><label data-t="phone"></label><input id="newCompanyPhone"></div><div class="field"><label data-t="address"></label><input id="newAddress"></div><div class="field"><label data-t="industry"></label><select id="newIndustry"></select></div><div class="field"><label data-t="customerStatus"></label><select id="newCustomerStatus"></select></div><div class="field"><label data-t="notes"></label><textarea id="newCompanyNote"></textarea></div><button id="cancelNewCustomer" type="button" class="secondary" data-t="back"></button></div></section>
<section id="contactSection" class="section hidden"><h2 data-t="stepContact"></h2><div id="contactStatus" class="status"></div><div id="contactResults" class="results"><div id="contactList"></div><button id="newContactBtn" type="button" class="action" data-t="addContact"></button></div><div id="selectedContact" class="box selected"><div id="selectedContactInfo"></div><button id="changeContact" type="button" class="secondary" data-t="change"></button></div><div id="newContact" class="box formbox"><h3 data-t="addContact"></h3><div class="field"><label data-t="name"></label><input id="newContactName"></div><div class="field"><label data-t="department"></label><input id="newDepartment"></div><div class="field"><label data-t="jobTitle"></label><input id="newJobTitle"></div><div class="field"><label>Email</label><input id="newEmail" type="email"></div><div class="field"><label data-t="mobile"></label><input id="newMobile"></div><div class="field"><label data-t="phone"></label><input id="newContactPhone"></div><div class="field"><label data-t="extension"></label><input id="newExtension"></div><div class="field"><label data-t="notes"></label><textarea id="newContactNote"></textarea></div><button id="cancelNewContact" type="button" class="secondary" data-t="back"></button></div></section>
<section id="visitSection" class="section hidden"><h2 data-t="stepVisit"></h2><div class="field"><label data-t="visitDate"></label><input id="visitDate" type="date"></div><div class="field"><label data-t="visitType"></label><select id="visitType"></select></div><div class="field"><label data-t="visitDetails"></label><textarea id="visitContent"></textarea></div><div class="field"><label data-t="nextAction"></label><textarea id="nextStep"></textarea></div><div class="field"><label data-t="followDate"></label><input id="followDate" type="date"></div><div class="field"><label data-t="stage"></label><select id="salesStage"><option value="">-</option><option>Stage 1</option><option>Stage 2</option><option>Stage 3</option><option>Stage 4</option><option>Stage 5</option><option>Stage 6</option><option>Stage 7</option></select></div></section><button id="submitBtn" class="blue hidden" data-t="submit"></button><div id="finalResult" class="box selected"></div></form></main></div></div>
<script>
const $=id=>document.getElementById(id);let lang="zh-TW",mode="visit",WOFF_ID="",ID_TOKEN="",verifiedUser=null,customerMode="unknown",contactMode="unknown",selectedCustomer=null,selectedContact=null,detailCustomer=null,detailContact=null;
const L={"zh-TW":{loading:"載入中",verifying:"正在驗證 LINE WORKS 與 kintone 身分...",verified:"已驗證",failed:"身分驗證失敗",customerSearch:"🔍 客戶查詢",contactSearch:"👥 聯絡人查詢",history:"📚 拜訪紀錄",visit:"📝 拜訪紀錄回報",search:"搜尋",back:"返回",change:"重新選擇",createVisit:"建立拜訪紀錄",viewCompany:"查看所屬公司",customerDetail:"客戶完整資料",contactDetail:"聯絡人完整資料",stepCustomer:"1. 選擇客戶",stepContact:"2. 選擇聯絡人",stepVisit:"3. 填寫拜訪內容",addCustomer:"＋ 建立新客戶",addContact:"＋ 建立新聯絡人",companyId:"統一編號 *",customerName:"客戶名稱 *",keywords:"搜尋關鍵字",phone:"公司電話",address:"地址",industry:"產業別 *",customerStatus:"客戶狀態 *",notes:"備註",name:"姓名 *",department:"部門",jobTitle:"職稱",mobile:"手機",extension:"分機",visitDate:"拜訪日期 *",visitType:"拜訪方式 *",visitDetails:"拜訪內容 *",nextAction:"下一步 *",followDate:"下次追蹤日期",stage:"案件階段",submit:"送出拜訪紀錄",min2:"請至少輸入 2 個字",noData:"查無資料",required:"請完成必填欄位",success:"拜訪紀錄建立成功",customer:"客戶",contact:"聯絡人",reporter:"回報者",repeat:"再建立一筆拜訪紀錄"},en:{loading:"Loading",verifying:"Verifying LINE WORKS and kintone identity...",verified:"Verified",failed:"Identity verification failed",customerSearch:"🔍 Customer Search",contactSearch:"👥 Contact Search",history:"📚 Visit History",visit:"📝 Visit Report",search:"Search",back:"Back",change:"Change",createVisit:"Create Visit",viewCompany:"View Company",customerDetail:"Customer Details",contactDetail:"Contact Details",stepCustomer:"1. Select Customer",stepContact:"2. Select Contact",stepVisit:"3. Visit Details",addCustomer:"＋ Add Customer",addContact:"＋ Add Contact",companyId:"Company ID *",customerName:"Customer Name *",keywords:"Search Keywords",phone:"Company Phone",address:"Address",industry:"Industry *",customerStatus:"Customer Status *",notes:"Notes",name:"Name *",department:"Department",jobTitle:"Job Title",mobile:"Mobile",extension:"Extension",visitDate:"Visit Date *",visitType:"Visit Type *",visitDetails:"Visit Details *",nextAction:"Next Action *",followDate:"Next Follow-up Date",stage:"Sales Stage",submit:"Submit Visit Report",min2:"Enter at least 2 characters",noData:"No results",required:"Complete all required fields",success:"Visit report created",customer:"Customer",contact:"Contact",reporter:"Reporter",repeat:"Create Another Visit"},ja:{loading:"読み込み中",verifying:"LINE WORKSとkintoneのユーザーを確認しています...",verified:"認証済み",failed:"ユーザー認証に失敗しました",customerSearch:"🔍 顧客検索",contactSearch:"👥 担当者検索",history:"📚 訪問履歴",visit:"📝 訪問記録の登録",search:"検索",back:"戻る",change:"変更",createVisit:"訪問記録を登録",viewCompany:"所属会社を確認",customerDetail:"顧客詳細",contactDetail:"担当者詳細",stepCustomer:"1. 顧客を選択",stepContact:"2. 担当者を選択",stepVisit:"3. 訪問内容",addCustomer:"＋ 新規顧客",addContact:"＋ 新規担当者",companyId:"統一番号 *",customerName:"顧客名 *",keywords:"検索キーワード",phone:"会社電話番号",address:"住所",industry:"業種 *",customerStatus:"顧客ステータス *",notes:"備考",name:"氏名 *",department:"部門",jobTitle:"役職",mobile:"携帯電話",extension:"内線",visitDate:"訪問日 *",visitType:"訪問方法 *",visitDetails:"訪問内容 *",nextAction:"次のアクション *",followDate:"次回フォロー日",stage:"案件ステージ",submit:"訪問記録を登録",min2:"2文字以上入力してください",noData:"該当データなし",required:"必須項目を入力してください",success:"訪問記録を登録しました",customer:"顧客",contact:"担当者",reporter:"報告者",repeat:"訪問記録を追加"}};
const inds={"zh-TW":[["製造業","製造業"],["零售業","零售業"],["金融業","金融業"],["服務業","服務業"],["醫療生技業","醫療生技業"],["物流業","物流業"],["建築營造業","建築營造業"],["資訊業","資訊業"]],en:[["製造業","Manufacturing"],["零售業","Retail"],["金融業","Finance"],["服務業","Services"],["醫療生技業","Healthcare"],["物流業","Logistics"],["建築營造業","Construction"],["資訊業","IT"]],ja:[["製造業","製造業"],["零售業","小売業"],["金融業","金融業"],["服務業","サービス業"],["醫療生技業","医療・バイオ"],["物流業","物流業"],["建築營造業","建設業"],["資訊業","情報通信業"]]};
const sts={"zh-TW":[["潛在客戶","潛在客戶"],["洽談中","洽談中"],["既有客戶","既有客戶"],["停止追蹤","停止追蹤"]],en:[["潛在客戶","Prospect"],["洽談中","In Discussion"],["既有客戶","Existing Customer"],["停止追蹤","Stop Follow-up"]],ja:[["潛在客戶","見込み顧客"],["洽談中","商談中"],["既有客戶","既存顧客"],["停止追蹤","フォロー停止"]]};
const vts={"zh-TW":[["","請選擇"],["客戶拜訪","客戶拜訪"],["線上會議","線上會議"],["電話","電話"],["Email","Email"],["LINE WORKS","LINE WORKS"],["其他","其他"]],en:[["","Select"],["客戶拜訪","Customer Visit"],["線上會議","Online Meeting"],["電話","Phone"],["Email","Email"],["LINE WORKS","LINE WORKS"],["其他","Other"]],ja:[["","選択"],["客戶拜訪","顧客訪問"],["線上會議","オンライン会議"],["電話","電話"],["Email","Email"],["LINE WORKS","LINE WORKS"],["其他","その他"]]};
const t=k=>L[lang][k]||k,esc=v=>String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function options(id,data,blank=false){const e=$(id),old=e.value;e.innerHTML=blank?'<option value="">-</option>':"";data.forEach(([v,l])=>e.insertAdjacentHTML("beforeend",`<option value="${esc(v)}">${esc(l)}</option>`));if([...e.options].some(o=>o.value===old))e.value=old}
function setLang(v){lang=v;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===v));options("newIndustry",inds[v],true);options("newCustomerStatus",sts[v]);options("visitType",vts[v]);applyMode()}
function detectLang(){const q=new URLSearchParams(location.search).get("lang");if(["zh-TW","en","ja"].includes(q))return q;const n=(navigator.language||"").toLowerCase();return n.startsWith("ja")?"ja":n.startsWith("en")?"en":"zh-TW"}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{const u=new URL(location.href);u.searchParams.set("lang",b.dataset.lang);location.href=u});
function show(id){$(id).classList.remove("hidden")}function hide(id){$(id).classList.add("hidden")}function status(id,msg,ok=false){const e=$(id);e.className=`status show ${ok?"ok":"err"}`;e.textContent=msg}
function authHeaders(json=false){return{Authorization:`Bearer ${ID_TOKEN}`,...(json?{"Content-Type":"application/json"}:{})}}
async function loadConfig(){const m=new URLSearchParams(location.search).get("mode")||"visit",r=await fetch("/api/config?mode="+encodeURIComponent(m)),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message);WOFF_ID=d.woffId;mode=d.mode}
async function verifyIdentity(){ID_TOKEN=woff.getIDToken();if(!ID_TOKEN)throw new Error("WOFF ID Token unavailable. Check openid/email/profile scopes.");const r=await fetch("/api/auth/verify",{method:"POST",headers:authHeaders()}),d=await r.json();if(!r.ok||!d.success||!d.verified)throw new Error(d.message||t("failed"));verifiedUser=d.user;$("identity").className="identity ok";$("identity").innerHTML=`✅ ${t("verified")}<br><strong>${esc(d.user.kintoneUserName||d.user.name)}</strong><br>${esc(d.user.email)}`;show("app")}
function applyMode(){["customerView","contactView","historyView","visitForm"].forEach(hide);$("pageTitle").textContent=mode==="visit"?t("visit"):"Customer CRM";$("modeBadge").textContent=t(mode==="customer"?"customerSearch":mode==="contact"?"contactSearch":mode==="history"?"history":"visit");$("subtitle").textContent="";show(mode==="customer"?"customerView":mode==="contact"?"contactView":mode==="history"?"historyView":"visitForm")}
const ready=new Promise((resolve,reject)=>window.addEventListener("load",async()=>{try{lang=detectLang();await loadConfig();setLang(lang);await woff.init({
  woffId: WOFF_ID
});("identity").textContent=t("verifying");await verifyIdentity();resolve()}catch(e){$("identity").className="identity bad";$("identity").innerHTML=`⚠️ ${t("failed")}<br>${esc(e.message)}`;reject(e)}},{once:true}));ready.catch(()=>{});$("visitDate").value=new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"});
async function api(url){const r=await fetch(url),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message);return d}
function customerInfo(c){return`<div class="name">${esc(c.company_name)}</div>${t("companyId")}：${esc(c.company_id)}<br>${t("industry")}：${esc(c.industry||"-")}<br>${t("customerStatus")}：${esc(c.customer_status||"-")}<br>${t("phone")}：${esc(c.company_phone||"-")}`}
function contactInfo(p){return`<div class="name">${esc(p.contact_name)}</div>${t("customer")}：${esc(p.company_name||"-")}<br>${t("department")}：${esc(p.department||"-")}<br>${t("jobTitle")}：${esc(p.job_title||"-")}<br>Email：${esc(p.email||"-")}<br>${t("mobile")}：${esc(p.mobile||"-")}<br>Contact ID：${esc(p.contact_id)}`}
function customerButton(c,fn){const b=document.createElement("button");b.type="button";b.className="item";b.innerHTML=customerInfo(c);b.onclick=()=>fn(c);return b}
async function findCustomers(input,list,result,fn){const q=$(input).value.trim();if(q.length<2)return status(input==="cq"?"cqStatus":input==="historyQuery"?"historyStatus":"customerStatus",t("min2"));const d=await api("/api/customers?keyword="+encodeURIComponent(q));$(list).innerHTML="";(d.customers||[]).forEach(c=>$(list).appendChild(customerButton(c,fn)));$(result).classList.add("show")}
async function showCustomerDetail(c){const d=await api("/api/customer-detail?companyId="+encodeURIComponent(c.company_id));detailCustomer=d.customer;$("customerDetailInfo").innerHTML=customerInfo(d.customer);$("customerContacts").innerHTML=(d.contacts||[]).map(contactInfo).join("");$("cqResults").classList.remove("show");$("customerDetail").classList.add("show")}
$("cqBtn").onclick=()=>findCustomers("cq","cqList","cqResults",showCustomerDetail);$("customerBack").onclick=()=>{$("customerDetail").classList.remove("show");$("cqResults").classList.add("show")};$("customerVisit").onclick=()=>location.href=link("visit",detailCustomer.company_id);
async function findContacts(){const q=$("contactQuery").value.trim();if(q.length<2)return status("contactQueryStatus",t("min2"));const d=await api("/api/contact-search?keyword="+encodeURIComponent(q));$("contactQueryList").innerHTML="";(d.contacts||[]).forEach(p=>{const b=document.createElement("button");b.type="button";b.className="item";b.innerHTML=contactInfo(p);b.onclick=()=>{detailContact=p;$("contactDetailInfo").innerHTML=contactInfo(p);$("contactQueryResults").classList.remove("show");$("contactDetail").classList.add("show")};$("contactQueryList").appendChild(b)});$("contactQueryResults").classList.add("show")}
$("contactQueryBtn").onclick=findContacts;$("contactBack").onclick=()=>{$("contactDetail").classList.remove("show");$("contactQueryResults").classList.add("show")};$("contactCustomer").onclick=()=>location.href=link("customer",detailContact.company_id);$("contactVisit").onclick=()=>location.href=link("visit",detailContact.company_id,detailContact.contact_id);
async function loadHistory(c){const d=await api("/api/visits?companyId="+encodeURIComponent(c.company_id));$("historyCompanyTitle").textContent=c.company_name;$("historyCompanyInfo").innerHTML=customerInfo(c);$("historyCount").textContent=`${d.count}`;$("historyList").innerHTML="";(d.visits||[]).forEach(v=>{const x=document.createElement("div");x.className="visit-card";x.innerHTML=`<div class="name">${esc(v.visit_date)} ${esc(v.sales_stage||"")}</div>${esc(v.contact_name)}<br>${t("visitType")}：${esc(v.visit_type)}<br>${t("visitDetails")}：${esc(v.visit_content)}<br>${t("nextAction")}：${esc(v.next_step)}`;const b=document.createElement("button");b.className="blue";b.textContent=t("repeat");b.onclick=()=>location.href=link("visit",c.company_id,v.contact_id);x.appendChild(b);$("historyList").appendChild(x)});$("historyResults").classList.remove("show");$("historyDetail").classList.add("show")}
$("historyQueryBtn").onclick=()=>findCustomers("historyQuery","historyCustomerList","historyResults",loadHistory);$("historyBack").onclick=()=>{$("historyDetail").classList.remove("show");$("historyResults").classList.add("show")};
async function selectCustomer(c,preferred=""){customerMode="existing";selectedCustomer=c;$("selectedCustomerInfo").innerHTML=customerInfo(c);hide("customerSearch");$("selectedCustomer").classList.add("show");show("contactSection");const d=await api("/api/contacts?companyId="+encodeURIComponent(c.company_id));$("contactList").innerHTML="";(d.contacts||[]).forEach(p=>{const b=document.createElement("button");b.className="item";b.type="button";b.innerHTML=contactInfo(p);b.onclick=()=>selectContact(p);$("contactList").appendChild(b)});$("contactResults").classList.add("show");if(preferred){const p=(d.contacts||[]).find(x=>x.contact_id===preferred);if(p)selectContact(p)}}
function selectContact(p){contactMode="existing";selectedContact=p;$("selectedContactInfo").innerHTML=contactInfo(p);$("contactResults").classList.remove("show");$("selectedContact").classList.add("show");show("visitSection");show("submitBtn")}
$("customerBtn").onclick=()=>findCustomers("customerKeyword","customerList","customerResults",selectCustomer);$("newCustomerBtn").onclick=()=>{customerMode="new";hide("customerSearch");$("newCustomer").classList.add("show");show("contactSection");$("newContact").classList.add("show");contactMode="new";show("visitSection");show("submitBtn")};$("newContactBtn").onclick=()=>{contactMode="new";$("contactResults").classList.remove("show");$("newContact").classList.add("show");show("visitSection");show("submitBtn")};$("changeCustomer").onclick=$("cancelNewCustomer").onclick=()=>location.href=link("visit");$("changeContact").onclick=$("cancelNewContact").onclick=()=>selectedCustomer&&selectCustomer(selectedCustomer);
function link(m,c="",p=""){const u=new URL(location.origin);u.searchParams.set("mode",m);u.searchParams.set("lang",lang);if(c)u.searchParams.set("companyId",c);if(p)u.searchParams.set("contactId",p);return u}
ready.then(async()=>{const q=new URLSearchParams(location.search),c=q.get("companyId"),p=q.get("contactId")||"";if(!c)return;const d=await api("/api/customer-detail?companyId="+encodeURIComponent(c));if(mode==="visit")selectCustomer(d.customer,p);if(mode==="customer")showCustomerDetail(d.customer);if(mode==="history")loadHistory(d.customer)}).catch(()=>{});
$("visitForm").onsubmit=async e=>{e.preventDefault();if(customerMode==="unknown"||contactMode==="unknown")return alert(t("required"));const customer=customerMode==="existing"?{company_id:selectedCustomer.company_id}:{company_id:$("newCompanyId").value.trim(),company_name:$("newCompanyName").value.trim(),search_keywords:$("newKeywords").value.trim(),company_phone:$("newCompanyPhone").value.trim(),company_address:$("newAddress").value.trim(),industry:$("newIndustry").value,customer_status:$("newCustomerStatus").value,company_note:$("newCompanyNote").value.trim()};const contact=contactMode==="existing"?{contact_id:selectedContact.contact_id}:{contact_name:$("newContactName").value.trim(),department:$("newDepartment").value.trim(),job_title:$("newJobTitle").value.trim(),email:$("newEmail").value.trim(),mobile:$("newMobile").value.trim(),phone:$("newContactPhone").value.trim(),extension:$("newExtension").value.trim(),contact_note:$("newContactNote").value.trim()};const visit={visit_date:$("visitDate").value,visit_type:$("visitType").value,visit_content:$("visitContent").value.trim(),next_step:$("nextStep").value.trim(),next_followup_date:$("followDate").value,sales_stage:$("salesStage").value};if(!visit.visit_date||!visit.visit_type||!visit.visit_content||!visit.next_step)return alert(t("required"));$("submitBtn").disabled=true;try{const r=await fetch("/api/visit",{method:"POST",headers:authHeaders(true),body:JSON.stringify({customerMode,contactMode,customer,contact,visit})}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message);$("finalResult").classList.add("show");$("finalResult").innerHTML=`✅ ${t("success")}<br>${t("reporter")}：${esc(d.reporter.name)}<br>${t("customer")}：${esc(d.customer.company_name)}<br>${t("contact")}：${esc(d.contact.contact_name)}<br>Record ID：${esc(d.visitRecordId)}`;try{await woff.sendMessage({content:`✅ ${t("success")}\n${t("reporter")}: ${d.reporter.name}\n${t("customer")}: ${d.customer.company_name}\n${t("contact")}: ${d.contact.contact_name}\nRecord ID: ${d.visitRecordId}`})}catch{}}catch(err){alert(err.message)}finally{$("submitBtn").disabled=false}};
</script></body></html>
