async function config(){const requested=new URLSearchParams(location.search).get("mode")||"visit";const r=await fetch("/api/config?mode="+encodeURIComponent(requested),{cache:"no-store"}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Config error");WOFF_ID=d.woffId;mode=d.mode;return d}
function applyMode(){["visitForm","customerView","contactView","historyView"].forEach(hide);$("title").textContent=mode==="visit"?t("visitTitle"):t("crm");if(mode==="customer"){$("badge").textContent=t("customerSearchTitle");$("subtitle").textContent=t("customerSub");show("customerView")}else if(mode==="contact"){$("badge").textContent=t("contactSearchTitle");$("subtitle").textContent=t("contactSub");show("contactView")}else if(mode==="history"){$("badge").textContent=t("historyTitle");$("subtitle").textContent=t("historySub");show("historyView")}else{$("badge").textContent=t("visitTitle");$("subtitle").textContent=t("visitSub");show("visitForm")}}
const ready=new Promise((resolve,reject)=>window.addEventListener("load",async()=>{try{lang=detectLang();await config();setLang(lang);await woff.init({woffId:WOFF_ID});$("identity").textContent="正在驗證 LINE WORKS 與 kintone 身分...";await verifyIdentity();resolve()}catch(e){$("identity").className="identity bad";$("identity").innerHTML=`⚠️ 身分驗證失敗<br>${esc(e.message)}`;reject(e)}},{once:true}));ready.catch(()=>{});$("visitDate").value=new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Taipei"});
async function customerSearch(q){const r=await fetch("/api/customers?keyword="+encodeURIComponent(q)),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||t("noData"));return d}
function customerCard(c,fn){const b=document.createElement("button");b.type="button";b.className="result";b.innerHTML=`<div class="name">${esc(c.company_name)}</div><div class="info">${t("companyId")}：${esc(c.company_id)}<br>${t("industry")}：${esc(c.industry||t("notSet"))}<br>${t("customerStatus")}：${esc(c.customer_status||t("notSet"))}<br>${t("companyPhone")}：${esc(c.company_phone||t("notFilled"))}</div>`;b.onclick=()=>fn(c);return b}
async function searchCustomerView(){const q=$("cq").value.trim();if(q.length<2)return status("cqStatus","error",t("min2"));status("cqStatus","warning",t("searching"));try{const d=await customerSearch(q);$("cqList").innerHTML="";$("cqTitle").textContent=d.found?t("foundCustomers")(d.count):t("noData");(d.customers||[]).forEach(c=>$("cqList").appendChild(customerCard(c,showCustomerDetail)));$("cqResults").classList.add("visible");status("cqStatus",d.found?"success":"warning",d.found?t("foundCustomers")(d.count):t("noData"))}catch(e){status("cqStatus","error",e.message)}}
async function showCustomerDetail(c){const r=await fetch("/api/customer-detail?companyId="+encodeURIComponent(c.company_id)),d=await r.json();if(!r.ok||!d.success)return status("cqStatus","error",d.message||t("noData"));detailCustomer=d.customer;$("customerDetailInfo").innerHTML=customerInfo(d.customer);const box=$("customerDetailContacts");box.innerHTML=`<h3>${t("contact")} (${d.contactCount})</h3>`;(d.contacts||[]).forEach(p=>box.innerHTML+=contactHtml(p));$("cqResults").classList.remove("visible");$("customerDetail").classList.add("visible")}
function customerInfo(c){return `<strong>${esc(c.company_name)}</strong><br>${t("companyId")}：${esc(c.company_id)}<br>${t("industry")}：${esc(c.industry||t("notSet"))}<br>${t("customerStatus")}：${esc(c.customer_status||t("notSet"))}<br>${t("companyPhone")}：${esc(c.company_phone||t("notFilled"))}<br>${t("address")}：${esc(c.company_address||t("notFilled"))}<br>${t("searchKeywords")}：${esc(c.search_keywords||t("notSet"))}<br>${t("notes")}：${esc(c.company_note||t("notFilled"))}`}
function contactHtml(p){return `<div class="contact-card"><div class="name">${esc(p.contact_name||t("notFilled"))}</div>${t("customer")}：${esc(p.company_name||t("notFilled"))}<br>${t("department")}：${esc(p.department||t("notFilled"))}<br>${t("jobTitle")}：${esc(p.job_title||t("notFilled"))}<br>Email：${esc(p.email||t("notFilled"))}<br>${t("mobile")}：${esc(p.mobile||t("notFilled"))}<br>Contact ID：${esc(p.contact_id)}</div>`}
$("cqBtn").onclick=searchCustomerView;$("cq").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();searchCustomerView()}};$("customerBack").onclick=()=>{$("customerDetail").classList.remove("visible");$("cqResults").classList.add("visible")};$("customerVisit").onclick=()=>location.href=link("visit",detailCustomer.company_id);
async function searchContacts(){const q=$("contactQuery").value.trim();if(q.length<2)return status("contactQueryStatus","error",t("min2"));status("contactQueryStatus","warning",t("searching"));try{const r=await fetch("/api/contact-search?keyword="+encodeURIComponent(q)),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message);$("contactQueryList").innerHTML="";$("contactQueryTitle").textContent=d.found?t("foundContacts")(d.count):t("noData");(d.contacts||[]).forEach(p=>{const b=document.createElement("button");b.type="button";b.className="result";b.innerHTML=contactHtml(p);b.onclick=()=>showContactDetail(p);$("contactQueryList").appendChild(b)});$("contactQueryResults").classList.add("visible");status("contactQueryStatus",d.found?"success":"warning",d.found?t("foundContacts")(d.count):t("noData"))}catch(e){status("contactQueryStatus","error",e.message)}}
function showContactDetail(p){detailContact=p;$("contactDetailInfo").innerHTML=contactHtml(p);$("contactQueryResults").classList.remove("visible");$("contactDetail").classList.add("visible")}
$("contactQueryBtn").onclick=searchContacts;$("contactQuery").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();searchContacts()}};$("contactBack").onclick=()=>{$("contactDetail").classList.remove("visible");$("contactQueryResults").classList.add("visible")};$("contactCustomer").onclick=()=>location.href=link("customer",detailContact.company_id);$("contactVisit").onclick=()=>location.href=link("visit",detailContact.company_id,detailContact.contact_id);
async function searchHistoryCustomers(){const q=$("historyQuery").value.trim();if(q.length<2)return status("historyStatus","error",t("min2"));status("historyStatus","warning",t("searching"));try{const d=await customerSearch(q);$("historyCustomerList").innerHTML="";$("historyTitle").textContent=d.found?t("foundCustomers")(d.count):t("noData");(d.customers||[]).forEach(c=>$("historyCustomerList").appendChild(customerCard(c,loadHistory)));$("historyResults").classList.add("visible");status("historyStatus",d.found?"success":"warning",d.found?t("foundCustomers")(d.count):t("noData"))}catch(e){status("historyStatus","error",e.message)}}
async function loadHistory(c){const r=await fetch("/api/visits?companyId="+encodeURIComponent(c.company_id)),d=await r.json();if(!r.ok||!d.success)return status("historyStatus","error",d.message||t("noData"));$("historyCompanyTitle").textContent=d.customer.company_name;$("historyCompanyInfo").innerHTML=customerInfo(d.customer);$("historyCount").textContent=t("visitCount")(d.count);$("historyList").innerHTML="";if(!d.visits.length)$("historyList").innerHTML=`<div class="visit-card">${t("noVisits")}</div>`;else d.visits.forEach(v=>$("historyList").appendChild(historyCard(v,d.customer)));$("historyResults").classList.remove("visible");$("historyDetail").classList.add("visible")}
function historyCard(v,c){const d=document.createElement("div");d.className="visit-card";d.innerHTML=`<div class="name">📅 ${esc(v.visit_date||t("notFilled"))}　${esc(v.sales_stage||"")}</div>👤 ${esc(v.contact_name||t("notFilled"))}｜${esc(v.department||t("notFilled"))}｜${esc(v.job_title||t("notFilled"))}<br>📌 ${esc(v.visit_type||t("notFilled"))}<hr><strong>${t("visitDetails")}：</strong><br>${esc(v.visit_content||t("notFilled"))}<br><strong>${t("nextAction")}：</strong><br>${esc(v.next_step||t("notFilled"))}<br><strong>${t("followDate")}：</strong>${esc(v.next_followup_date||t("notSet"))}`;const b=document.createElement("button");b.type="button";b.className="blue";b.style.marginTop="10px";b.textContent=t("repeatVisit");b.onclick=()=>location.href=link("visit",c.company_id,v.contact_id||"");d.appendChild(b);return d}
$("historyQueryBtn").onclick=searchHistoryCustomers;$("historyQuery").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();searchHistoryCustomers()}};$("historyBack").onclick=()=>{$("historyDetail").classList.remove("visible");$("historyResults").classList.add("visible")};
async function searchVisitCustomer(){const q=$("customerKeyword").value.trim();if(q.length<2)return status("customerStatus","error",t("min2"));try{const d=await customerSearch(q);$("customerList").innerHTML="";$("customerResultsTitle").textContent=d.found?t("foundCustomers")(d.count):t("noData");(d.customers||[]).forEach(c=>$("customerList").appendChild(customerCard(c,selectCustomer)));$("customerResults").classList.add("visible")}catch(e){status("customerStatus","error",e.message)}}
async function selectCustomer(c,preferred=""){customerMode="existing";selectedCustomer=c;$("selectedCustomerInfo").innerHTML=customerInfo(c);hide("customerSearch");$("selectedCustomer").classList.add("visible");show("contactSection");await loadContacts(c.company_id,preferred)}
function showNewCustomer(){customerMode="new";hide("customerSearch");$("newCustomer").classList.add("visible");show("contactSection");showNewContact()}
async function loadContacts(companyId,preferred=""){contactMode="unknown";selectedContact=null;$("selectedContact").classList.remove("visible");$("newContact").classList.remove("visible");hide("visitSection");hide("submitBtn");status("contactStatus","warning",t("loadingData"));const r=await fetch("/api/contacts?companyId="+encodeURIComponent(companyId)),d=await r.json();if(!r.ok||!d.success)return status("contactStatus","error",d.message);$("contactList").innerHTML="";(d.contacts||[]).forEach(p=>{const b=document.createElement("button");b.type="button";b.className="result";b.innerHTML=contactHtml(p);b.onclick=()=>selectContact(p);$("contactList").appendChild(b)});$("contactResultsTitle").textContent=d.found?t("foundContacts")(d.count):t("noData");$("contactResults").classList.add("visible");status("contactStatus",d.found?"success":"warning",d.found?t("foundContacts")(d.count):t("noData"));if(preferred){const p=(d.contacts||[]).find(x=>x.contact_id===preferred);if(p)selectContact(p)}}
function selectContact(p){contactMode="existing";selectedContact=p;$("selectedContactInfo").innerHTML=contactHtml(p);$("contactResults").classList.remove("visible");$("selectedContact").classList.add("visible");showVisit()}
function showNewContact(){contactMode="new";$("contactResults").classList.remove("visible");$("selectedContact").classList.remove("visible");$("newContact").classList.add("visible");showVisit()}function showVisit(){show("visitSection");show("submitBtn")}
$("customerBtn").onclick=searchVisitCustomer;$("customerKeyword").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();searchVisitCustomer()}};$("newCustomerBtn").onclick=showNewCustomer;$("changeCustomer").onclick=$("cancelNewCustomer").onclick=()=>location.href=link("visit");$("newContactBtn").onclick=showNewContact;$("changeContact").onclick=$("cancelNewContact").onclick=()=>selectedCustomer?loadContacts(selectedCustomer.company_id):showNewContact();
function link(m,companyId="",contactId=""){const u=new URL(location.origin+"/");u.searchParams.set("mode",m);u.searchParams.set("lang",lang);if(companyId)u.searchParams.set("companyId",companyId);if(contactId)u.searchParams.set("contactId",contactId);return u.toString()}
async function preload(){const p=new URLSearchParams(location.search),companyId=p.get("companyId"),contactId=p.get("contactId")||"";if(!companyId)return;const r=await fetch("/api/customer-detail?companyId="+encodeURIComponent(companyId)),d=await r.json();if(r.ok&&d.success){if(mode==="visit")selectCustomer(d.customer,contactId);if(mode==="customer")showCustomerDetail(d.customer);if(mode==="history")loadHistory(d.customer)}}ready.then(preload).catch(()=>{});
async function sendMessage(d,v){await ready;if(!woff.isInClient())throw new Error("Not in LINE WORKS");const c=d.customer,p=d.contact,id=d.visitRecordId;const msg=lang==="en"?`✅【Visit Report Completed】\n\n🏢 Customer: ${c.company_name}\n👤 Contact: ${p.contact_name}\n📅 Visit Date: ${v.visit_date}\n📌 Visit Type: ${v.visit_type}\n💬 Visit Details: ${v.visit_content}\n📝 Next Action: ${v.next_step}\n📈 Sales Stage: ${v.sales_stage||"Not set"}\n\nKintone Record ID: ${id}`:lang==="ja"?`✅【訪問記録の登録が完了しました】\n\n🏢 顧客：${c.company_name}\n👤 担当者：${p.contact_name}\n📅 訪問日：${v.visit_date}\n📌 訪問方法：${v.visit_type}\n💬 訪問内容：${v.visit_content}\n📝 次のアクション：${v.next_step}\n📈 案件ステージ：${v.sales_stage||"未設定"}\n\nkintoneレコードID：${id}`:`✅【拜訪紀錄回報完成】\n\n🏢 客戶：${c.company_name}\n👤 聯絡人：${p.contact_name}\n📅 拜訪日期：${v.visit_date}\n📌 拜訪方式：${v.visit_type}\n💬 拜訪內容：${v.visit_content}\n📝 下一步：${v.next_step}\n📈 案件階段：${v.sales_stage||"未設定"}\n\nKintone Record ID：${id}`;await woff.sendMessage({content:msg})}
$("visitForm").onsubmit=async e=>{e.preventDefault();if(customerMode==="unknown"||contactMode==="unknown")return alert(t("required"));let customer=customerMode==="existing"?{company_id:selectedCustomer.company_id}:{company_id:$("newCompanyId").value.trim(),company_name:$("newCompanyName").value.trim(),search_keywords:$("newKeywords").value.trim(),company_phone:$("newCompanyPhone").value.trim(),company_address:$("newAddress").value.trim(),industry:$("newIndustry").value,customer_status:$("newCustomerStatus").value,company_note:$("newCompanyNote").value.trim()};if(customerMode==="new"&&(!customer.company_id||!customer.company_name||!customer.industry))return alert(t("required"));let contact=contactMode==="existing"?{contact_id:selectedContact.contact_id}:{contact_name:$("newContactName").value.trim(),department:$("newDepartment").value.trim(),job_title:$("newJobTitle").value.trim(),email:$("newEmail").value.trim(),mobile:$("newMobile").value.trim(),phone:$("newContactPhone").value.trim(),extension:$("newExtension").value.trim(),contact_note:$("newContactNote").value.trim()};if(contactMode==="new"&&!contact.contact_name)return alert(t("required"));const visit={visit_date:$("visitDate").value,visit_type:$("visitType").value,visit_content:$("visitContent").value.trim(),next_step:$("nextStep").value.trim(),next_followup_date:$("followDate").value,sales_stage:$("salesStage").value};if(!visit.visit_date||!visit.visit_type||!visit.visit_content||!visit.next_step)return alert(t("required"));$("submitBtn").disabled=true;try{const r=await fetch("/api/visit",{method:"POST",headers:authHeaders(true),body:JSON.stringify({customerMode,contactMode,customer,contact,visit})}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.message);let m=t("sent");try{await sendMessage(d,visit)}catch(err){m=t("messageFail")+": "+err.message}$("finalResult").innerHTML=`<strong>${t("success")}</strong><br>${t("customer")}：${esc(d.customer.company_name)}<br>${t("contact")}：${esc(d.contact.contact_name)}<br>Kintone Record ID：${esc(d.visitRecordId)}<br>${esc(m)}`;$("finalResult").classList.add("visible")}catch(err){alert(err.message)}finally{$("submitBtn").disabled=false}};
</script></body></html>
